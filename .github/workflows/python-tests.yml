name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Bootstrap pip inside uv environment
        run: |
          uv run -- python -m ensurepip --upgrade || true
          uv run -- python -m pip install --upgrade pip setuptools || true

      - name: Ensure requirements installed inside uv
        run: uv run -- python -m pip install -r requirements.txt

      - name: Run tests
        run: uv run -- python -m pytest -v

